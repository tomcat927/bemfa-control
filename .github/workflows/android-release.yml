name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/bemfa-control.jks
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bemfa-control.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release assets
        id: assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_NAME="bemfa-control-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          GITHUB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"
          PROXY_URL="https://gh-proxy.com/${GITHUB_URL}"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "github_url=$GITHUB_URL" >> "$GITHUB_OUTPUT"
          echo "proxy_url=$PROXY_URL" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_NAME: ${{ steps.assets.outputs.apk }}
          CHECKSUM_NAME: ${{ steps.assets.outputs.checksum }}
          GITHUB_URL: ${{ steps.assets.outputs.github_url }}
          PROXY_URL: ${{ steps.assets.outputs.proxy_url }}
        run: |
          cat > release-notes.md <<EOF
          ## Android APK 下载

          - [国内加速下载](${PROXY_URL})
          - [GitHub 原始下载](${GITHUB_URL})

          ## 文件校验

          - 文件：\`${APK_NAME}\`
          - SHA-256：见 \`${CHECKSUM_NAME}\`

          如果加速地址不可用，请使用 GitHub 原始下载地址。
          EOF
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file release-notes.md \
            "$APK_NAME" "$CHECKSUM_NAME"
